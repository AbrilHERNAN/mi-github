<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IMC</title>
</head>
<body>

    <h1>Calculadora de Índice de Masa Corporal</h1>

    <form action="calculadoraAHL.php" method="POST">

        <label for="peso">Peso (kg):</label>
        <input type="number" id="peso" name="peso" step="0.01" min="1" required>

        <br><br>

        <label for="altura">Altura (metros):</label>
        <input type="number" id="altura" name="altura" step="0.01" min="0.5" required>

        <br><br>

        <input type="submit" value="Calcular IMC">

    </form>

</body>
</html>
